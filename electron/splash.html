<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINCA CONTROL</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle, rgba(16,185,129,1) 0%, rgba(15,23,42,1) 70%);
        color: white;
        font-family: Inter, system-ui, sans-serif;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        border-radius: 2rem;
        background: rgba(15,23,42,0.88);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      }
      .logo {
        width: 160px;
        height: 160px;
        border-radius: 2rem;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .title {
        font-size: 1.5rem;
        text-align: center;
        margin: 0;
        letter-spacing: 0.04em;
      }
      .subtitle {
        margin: 0;
        opacity: 0.78;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img src="logo.png" alt="Finca Control" />
      </div>
      <h1 class="title">FINCA CONTROL</h1>
      <p class="subtitle">Cargando sistema de gestión agrícola y ganadera...</p>
    </div>
  </body>
</html>
