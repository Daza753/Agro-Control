<svg xmlns="http://www.w3.org/2000/svg" width="860" height="634" viewBox="0 0 1600 1180" role="img" aria-labelledby="title description">
  <title id="title">Vista de plantilla Word FincaControl con encabezado, pie y márgenes gráficos</title>
  <desc id="description">Dos páginas proporcionales a Carta, con las imágenes exactas del encabezado, pie y márgenes indicadas por el usuario.</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164b3b"/>
      <stop offset="1" stop-color="#102f27"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-8%" width="124%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#22352c" flood-opacity=".16"/>
    </filter>
    <style>
      .sans { font-family: "Aptos", "Segoe UI", Arial, sans-serif; }
      .serif { font-family: "Georgia", "Times New Roman", serif; }
      .ink { fill: #23342d; }
      .muted { fill: #68766e; }
      .green { fill: #164b3b; }
      .gold { fill: #b68b2d; }
      .micro { font-size: 10px; letter-spacing: 1.4px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="#e9eeeb"/>
  <rect x="35" y="26" width="1530" height="65" rx="12" fill="#fff" filter="url(#shadow)"/>
  <circle cx="69" cy="58" r="17" fill="#edf4ef"/>
  <path d="M69 68V47m0 12c-8 0-10-6-10-10 7 0 10 4 10 10m0-4c8 0 10-6 10-10-7 0-10 4-10 10" fill="none" stroke="#1b684c" stroke-width="2" stroke-linecap="round"/>
  <text x="101" y="64" class="sans" font-size="18" font-weight="700" fill="#173c2c">FincaControl</text>
  <text x="273" y="64" class="sans" font-size="14" fill="#68766e">Propuesta de plantilla Word · encabezado y pie a sangre</text>
  <rect x="1332" y="43" width="206" height="32" rx="16" fill="#f3f7f4"/>
  <text x="1435" y="64" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#547063">VISTA PREVIA · PARA AUTORIZAR</text>

  <text x="800" y="133" text-anchor="middle" class="sans micro" fill="#68766e">MAQUETA DE HOJAS WORD · SIN MÁRGENES BLANCOS AÑADIDOS</text>
  <text x="800" y="168" text-anchor="middle" class="serif" font-size="26" font-weight="700" fill="#173c2c">Encabezado, pie y laterales hechos con tus imágenes</text>
  <text x="800" y="193" text-anchor="middle" class="sans" font-size="13" fill="#68766e">Tamaño Carta (8,5 × 11″) · las franjas gráficas ocupan los bordes; el texto queda dentro del área libre</text>

  <!-- Letter page 1: the requested left margin, plus exact full-width header/footer artwork. -->
  <text x="118" y="207" class="sans" font-size="10" font-weight="700" fill="#718078">PÁGINA 1 · PORTADA · SOLO LATERAL IZQUIERDO</text>
  <text x="665" y="207" text-anchor="end" class="sans" font-size="10" font-weight="700" fill="#718078">CARTA · 8,5 × 11 in</text>
  <g filter="url(#shadow)"><rect x="118" y="214" width="547" height="708" fill="#fff"/></g>
  <image href="../public/images/margen_lateral_izquierdo_FincaControl_solo_margen.png" x="118" y="214" width="46" height="708" preserveAspectRatio="none"/>
  <image href="../public/images/encabezado_FincaControl_sin_bordes_blancos.png" x="118" y="214" width="547" height="125" preserveAspectRatio="none"/>
  <image href="../public/images/Banner%20agr%C3%ADcola%20con%20toro%20Nelore%20y%20paisaje%20tropical.png" x="495" y="339" width="170" height="528" preserveAspectRatio="xMidYMid slice"/>
  <rect x="164" y="339" width="331" height="528" fill="#fff"/>
  <rect x="185" y="376" width="34" height="3" rx="1.5" fill="#cba84d"/>
  <text x="185" y="404" class="sans micro gold">DOCUMENTO DE LA FINCA</text>
  <text x="185" y="452" class="serif" font-size="30" font-weight="700" fill="#123b31">Reporte de</text>
  <text x="185" y="488" class="serif" font-size="30" font-weight="700" fill="#123b31">gestión de finca</text>
  <text x="185" y="515" class="sans" font-size="12" fill="#68766e">[Título del documento]</text>
  <line x1="185" y1="539" x2="467" y2="539" stroke="#dce6df"/>
  <text x="185" y="566" class="sans" font-size="8" letter-spacing="1" font-weight="700" fill="#164b3b">PREPARADO PARA</text>
  <text x="185" y="586" class="sans" font-size="10" fill="#23342d">[Nombre de la finca o destinatario]</text>
  <text x="185" y="616" class="sans" font-size="8" letter-spacing="1" font-weight="700" fill="#164b3b">RESPONSABLE</text>
  <text x="185" y="636" class="sans" font-size="10" fill="#23342d">[Nombre del responsable]</text>
  <text x="185" y="666" class="sans" font-size="8" letter-spacing="1" font-weight="700" fill="#164b3b">FECHA · VERSIÓN</text>
  <text x="185" y="686" class="sans" font-size="9" fill="#23342d">[DD / MM / AAAA] · [Versión]</text>
  <image href="../public/images/Banner-pie%20de%20pagina%20FincaControl%20Verde%20y%20Dorado.png" x="118" y="867" width="547" height="55" preserveAspectRatio="none"/>

  <!-- Letter page 2: both requested side graphics, full-bleed header and footer. -->
  <text x="876" y="207" class="sans" font-size="10" font-weight="700" fill="#718078">PÁGINA 2 · INTERIOR · LATERALES IZQUIERDO Y DERECHO</text>
  <text x="1423" y="207" text-anchor="end" class="sans" font-size="10" font-weight="700" fill="#718078">CARTA · 8,5 × 11 in</text>
  <g filter="url(#shadow)"><rect x="876" y="214" width="547" height="708" fill="#fff"/></g>
  <image href="../public/images/margen_lateral_izquierdo_FincaControl_solo_margen.png" x="876" y="214" width="46" height="708" preserveAspectRatio="none"/>
  <image href="../public/images/margen_derecho_FincaControl_sin_espacio_extra.png" x="1381" y="214" width="42" height="708" preserveAspectRatio="none"/>
  <image href="../public/images/encabezado_FincaControl_sin_bordes_blancos.png" x="876" y="214" width="547" height="125" preserveAspectRatio="none"/>
  <image href="../public/images/Banner-pie%20de%20pagina%20FincaControl%20Verde%20y%20Dorado.png" x="876" y="867" width="547" height="55" preserveAspectRatio="none"/>

  <text x="936" y="366" class="sans micro gold">SECCIÓN 01</text>
  <text x="936" y="395" class="serif" font-size="21" font-weight="700" fill="#123b31">Resumen del documento</text>
  <text x="936" y="419" class="sans" font-size="10" fill="#23342d">Presente el propósito, el alcance y las conclusiones principales del</text>
  <text x="936" y="436" class="sans" font-size="10" fill="#23342d">documento. Reemplace este texto con el resumen de la finca.</text>
  <rect x="936" y="456" width="421" height="63" rx="5" fill="#eef4ef"/>
  <rect x="936" y="456" width="4" height="63" fill="#164b3b"/>
  <text x="952" y="478" class="sans" font-size="8" font-weight="700" letter-spacing=".8" fill="#164b3b">PUNTO CLAVE</text>
  <text x="952" y="497" class="sans" font-size="9" fill="#23342d">[Hallazgo, alerta o dato importante para destacar.]</text>
  <text x="936" y="550" class="sans micro gold">SECCIÓN 02</text>
  <text x="936" y="579" class="serif" font-size="19" font-weight="700" fill="#123b31">Datos y seguimiento</text>
  <text x="936" y="601" class="sans" font-size="9" fill="#68766e">Use esta tabla para resumir indicadores y observaciones relevantes.</text>
  <rect x="936" y="616" width="421" height="28" fill="#164b3b"/>
  <text x="950" y="634" class="sans" font-size="8" font-weight="700" fill="#fff">INDICADOR</text>
  <text x="1092" y="634" class="sans" font-size="8" font-weight="700" fill="#fff">VALOR</text>
  <text x="1173" y="634" class="sans" font-size="8" font-weight="700" fill="#fff">OBSERVACIÓN</text>
  <rect x="936" y="644" width="421" height="27" fill="#f3f7f4"/>
  <text x="950" y="661" class="sans" font-size="8" fill="#23342d">[Indicador]</text>
  <text x="1092" y="661" class="sans" font-size="8" fill="#23342d">[Valor]</text>
  <text x="1173" y="661" class="sans" font-size="8" fill="#23342d">[Observación]</text>
  <line x1="936" y1="671" x2="1357" y2="671" stroke="#d9e4dd"/>
  <text x="936" y="711" class="sans micro gold">SECCIÓN 03</text>
  <text x="936" y="740" class="serif" font-size="19" font-weight="700" fill="#123b31">Notas y responsables</text>
  <text x="936" y="763" class="sans" font-size="9" fill="#23342d">Agregue acciones pendientes, recomendaciones, fuentes o notas de</text>
  <text x="936" y="779" class="sans" font-size="9" fill="#23342d">seguimiento.</text>
  <text x="936" y="815" class="sans" font-size="8" font-weight="700" fill="#164b3b">PREPARADO POR</text>
  <text x="1151" y="815" class="sans" font-size="8" font-weight="700" fill="#164b3b">REVISADO POR</text>
  <line x1="936" y1="831" x2="1130" y2="831" stroke="#aab8af"/>
  <line x1="1151" y1="831" x2="1357" y2="831" stroke="#aab8af"/>
  <text x="936" y="845" class="sans" font-size="8" fill="#68766e">[Nombre y cargo]</text>
  <text x="1151" y="845" class="sans" font-size="8" fill="#68766e">[Nombre y cargo]</text>

  <rect x="112" y="960" width="1376" height="91" rx="12" fill="#fff" filter="url(#shadow)"/>
  <text x="143" y="990" class="sans" font-size="11" font-weight="700" fill="#164b3b">DISTRIBUCIÓN SEGÚN TUS ARCHIVOS</text>
  <text x="143" y="1017" class="sans" font-size="11" fill="#34473d">Encabezado: imagen a todo el ancho, pegada al borde superior.</text>
  <text x="692" y="1017" class="sans" font-size="11" fill="#34473d">Pie: imagen a todo el ancho, pegada al borde inferior.</text>
  <text x="143" y="1039" class="sans" font-size="10" fill="#34473d">Portada: solo margen izquierdo. Interior: márgenes gráficos izquierdo y derecho. Sin margen blanco agregado.</text>
  <text x="800" y="1100" text-anchor="middle" class="sans" font-size="11" font-weight="700" letter-spacing="1" fill="#68766e">PROPUESTA VISUAL PARA AUTORIZACIÓN · EL WORD DEFINITIVO NO SE MODIFICARÁ HASTA TU APROBACIÓN</text>
</svg>
