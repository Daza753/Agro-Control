  <text x="878" y="390" class="sans smallcaps goldText">SECCIÓN 01</text>
  <text x="878" y="423" class="serif" font-size="27" font-weight="700" fill="#153d2d">Resumen del documento</text>
  <text x="878" y="456" class="sans body ink">Use este espacio para presentar el propósito, el alcance y las conclusiones principales</text>
  <text x="878" y="479" class="sans body ink">del documento. El texto y los títulos quedan listos para reemplazarse en Word.</text>

